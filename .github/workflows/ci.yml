name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Example agent and client (scripted endpoint)
        run: python -m unittest discover -s examples -v

      - name: BYA runtime unit tests
        working-directory: bya-runtime
        run: python -m unittest discover -s tests -v

      - name: BYA evals (sample model)
        working-directory: bya-runtime
        run: python evals/run_evals.py
