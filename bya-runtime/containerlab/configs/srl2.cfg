set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "to srl1"
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.0.12.1/31
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description "to frr1"
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.0.23.0/31
set / network-instance default type default
set / network-instance default admin-state enable
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / routing-policy policy accept-all default-action policy-result accept
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65002
set / network-instance default protocols bgp router-id 10.255.0.2
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group ebgp export-policy [ accept-all ]
set / network-instance default protocols bgp group ebgp import-policy [ accept-all ]
set / network-instance default protocols bgp neighbor 10.0.12.0 peer-as 65001
set / network-instance default protocols bgp neighbor 10.0.12.0 peer-group ebgp
set / network-instance default protocols bgp neighbor 10.0.23.1 peer-as 65003
set / network-instance default protocols bgp neighbor 10.0.23.1 peer-group ebgp
