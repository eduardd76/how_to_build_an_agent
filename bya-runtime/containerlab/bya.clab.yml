# BYA lab: three routers in a triangle, eBGP everywhere.
#   srl1 (AS 65001) ── srl2 (AS 65002)
#      \               /
#       └── frr1 (AS 65003) ┘
# Deploy:   sudo containerlab deploy -t bya.clab.yml   (on macOS: inside an OrbStack Linux machine, see README.md)
# Destroy:  sudo containerlab destroy -t bya.clab.yml
name: bya

# Own management network, so the lab does not collide with the default 172.20.20.0/24 or other Docker networks.
# If this subnet is taken on your machine too, pick any free /24 (docker network inspect $(docker network ls -q) shows used ones).
mgmt:
  network: bya-mgmt
  ipv4-subnet: 172.29.29.0/24
  ipv6-subnet: 3fff:172:29:29::/64

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:latest
    linux:
      image: quay.io/frrouting/frr:10.1.0

  nodes:
    srl1:
      kind: nokia_srlinux
      startup-config: configs/srl1.cfg
    srl2:
      kind: nokia_srlinux
      startup-config: configs/srl2.cfg
    frr1:
      kind: linux
      binds:
        - configs/frr1.conf:/etc/frr/frr.conf
        - configs/frr-daemons:/etc/frr/daemons

  links:
    - endpoints: ["srl1:e1-1", "srl2:e1-1"]
    - endpoints: ["srl1:e1-2", "frr1:eth1"]
    - endpoints: ["srl2:e1-2", "frr1:eth2"]
